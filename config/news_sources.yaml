# 新闻源配置文件

sources:
  # 官媒/权威媒体
  - id: "cankaoxiaoxi"
    name: "参考消息"
    type: "official"
    enabled: true
    url: "https://china.cankaoxiaoxi.com/json/channel/{channel}/list.json"
    channels: ["zhongguo"]

  - id: "thepaper"
    name: "澎湃新闻"
    type: "official"
    enabled: true
    url: "https://cache.thepaper.cn/contentapi/wwwIndex/rightSidebar"

  # - id: "ifeng"
  #   name: "凤凰网"
  #   type: "portal"
  #   enabled: true
  #   url: "https://www.ifeng.com/"

  - id: "toutiao"
    name: "今日头条"
    type: "portal"
    enabled: true
    url: "https://www.toutiao.com/"

  # 财经/科技媒体
  - id: "wallstreetcn-live"
    name: "华尔街见闻快讯"
    type: "financial"
    enabled: true
    url: "https://api-one.wallstcn.com/apiv1/content/lives?channel=global-channel&limit={limit}"

  - id: "wallstreetcn-news"
    name: "华尔街见闻资讯"
    type: "financial"
    enabled: true
    url: "https://api-one.wallstcn.com/apiv1/content/information-flow?channel=global-channel&accept=article&limit={limit}"

  - id: "cls-telegraph"
    name: "财联社电报"
    type: "financial"
    enabled: true
    url: "https://www.cls.cn/nodeapi/updateTelegraphList"

  - id: "cls-depth"
    name: "财联社深度"
    type: "financial"
    enabled: false  # API 需要签名，暂时禁用
    url: "https://www.cls.cn/v3/depth/home/assembled/1000"

  - id: "36kr"
    name: "36氪"
    type: "tech"
    enabled: true
    url: "https://www.36kr.com/newsflashes"

  # AI 专业信源
  - id: "venturebeat-ai"
    name: "VentureBeat AI"
    type: "ai"
    enabled: true
    url: "https://venturebeat.com/category/ai/"

  - id: "36kr-ai"
    name: "36氪AI频道"
    type: "ai"
    enabled: true
    url: "https://www.36kr.com/information/AI/"

  - id: "mit-tech-review-ai"
    name: "MIT Tech Review AI"
    type: "ai"
    enabled: true
    url: "https://www.technologyreview.com/topic/artificial-intelligence/"

  - id: "infoq-ai"
    name: "InfoQ"
    type: "ai"
    enabled: true
    url: "https://www.infoq.cn/"

  # 航空航天专业信源
  # keyword_filter: false —— 该源内容 100% 是航空航天，跳过关键词筛选整源放行；
  # 未标此字段的源（如泰伯网）照常走关键词筛选（其 7x24 含低空经济招标等噪音）
  - id: "spacenews"
    name: "SpaceNews"
    type: "aerospace"
    enabled: true
    keyword_filter: false
    url: "https://spacenews.com/feed/"

  - id: "spaceflightnow"
    name: "Spaceflight Now"
    type: "aerospace"
    enabled: true
    keyword_filter: false
    url: "https://spaceflightnow.com/feed/"

  - id: "taibo"
    name: "泰伯网"
    type: "aerospace"
    enabled: true
    url: "https://www.taibo.cn/"

# 说明：
# id: 唯一标识符，同时也是解析器文件名（如 parsers/cankaoxiaoxi.py）
# name: 显示名称
# type: official（官媒）| financial（财经）| tech（科技）| portal（门户）| ai（AI专业）| aerospace（航空航天）
# enabled: 是否启用该源
# url: 数据源 URL
# channels: 仅用于有多频道的源（如参考消息）
# keyword_filter: false 时跳过关键词筛选（仅用于内容 100% 对口的纯领域源，如 SpaceNews）
